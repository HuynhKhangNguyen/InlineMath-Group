<script type="text/javascript">
  customBuildAssessment();
  validateContentInside();

  function customBuildAssessment() {
    $(".build-assessment-passage").each(function () {
      if ($(this).find(".ciu-matching-group").length > 0) {
        adjustContentForPassageGroup($(this));
      }
    });

    function adjustContentForPassageGroup($passageGroup) {
      $passageGroup
        .find(".passage-content")
        .removeClass("passage-invisible-content")
        .addClass("passage-group-content");
      $passageGroup
        .find(".question-group-building")
        .each(function (index, group) {
          if (index == 0) {
            var checkbox = $(group).find('input[name="selectedQuestion"]');
            checkbox.change(function () {
              var checked = $(this).prop("checked");
              updateCheckboxGroup($passageGroup, checked);
            });
          } else {
            $(group).addClass("question-group-multipart");
            $(group).find(".question-select-button").hide();
          }
        });
    }

    function updateCheckboxGroup($passageGroup, checked) {
      $passageGroup
        .find(".question-group-building")
        .find('input[name="selectedQuestion"]')
        .each(function (idx, checkbox) {
          if (idx > 0) {
            $(checkbox).prop("checked", checked);
          }
        });
    }
  }

  function validateContentInside() {
    $(".question-stem-content").each(function (idx, element) {
      processForFirstElement(element.firstChild);
    });

    $(".ciu-question-stem-content").each(function (idx, element) {
      processForFirstElement(element.firstChild);
    });

    function processForFirstElement(node) {
      if (node != null) {
        if (node.nodeType === 3) {
          if (node.nodeValue.trim() == "") {
            processForFirstElement(node.nextSibling);
          }
        } else {
          if ($(node).hasClass("question-group-content")) {
            processForFirstElement(node.firstChild);
          } else {
            $(node).addClass("ise-first-component");
          }
        }
      }
    }
  }

  function removeAudioForMath() {
    if ($("body").hasClass("math2018")) {
      $(".audio-component").remove();
    }
  }

  function normalizeFileName4Show(imageName) {
    if (imageName != null && imageName != "") {
      var temp = imageName.split(".");
      imageName = temp[0];
      if (imageName.indexOf("_1c") > 0) {
        imageName = imageName.substr(0, imageName.indexOf("_1c"));
      }
      if (imageName.indexOf("@2x") > 0) {
        imageName = imageName.substr(0, imageName.indexOf("@2x"));
      }
    }
    return imageName;
  }

  function showImageName4Math() {
    if ($(".math2018").length > 0) {
      $(".question_content img").each(function () {
        var alt = $(this).attr("alt");
        $(this).attr("title", alt != null ? "\n\n" + alt : "");
        $(this).addClass("image-title-display");
      });

      $(".passage_content img").each(function () {
        var alt = $(this).attr("alt");
        $(this).attr("title", alt != null ? "\n\n" + alt : "");
      });

      $(".screenElementContent img").each(function () {
        var alt = $(this).attr("alt");
        $(this).attr("title", alt != null ? "\n\n" + alt : "");
      });

      function generateImageTitlePopup(imgHover) {
        $(".image-title-popup").remove();

        var $imageTitlePopup = $(
          '<span class="image-title-popup"><span class="image-title-arrow"></span>' +
            $(imgHover).attr("imageTitleDisplay") +
            "</span>",
        );
        $("#pagecontainer").append($imageTitlePopup);

        $imageTitlePopup.css({
          "min-width": $(imgHover).width(),
        });

        adjustPositionDisplay(imgHover, $imageTitlePopup);
      }

      function adjustPositionDisplay(imageReference, $imageTitlePopup) {
        var cx =
          $(imageReference).offset().left + $(imageReference).width() / 2;
        var cy =
          $(imageReference).offset().top + +$(imageReference).height() + 15;

        var position_left = cx - $imageTitlePopup.outerWidth() / 2;
        var position_y = cy;

        if (position_left < 50) {
          position_left = 50;
        } else if (
          position_left + $imageTitlePopup.outerWidth() >
          $("#pagecontainer").offset().left + $("#pagecontainer").width()
        ) {
          position_left =
            $("#pagecontainer").offset().left +
            $("#pagecontainer").width() -
            $imageTitlePopup.outerWidth();
        }

        $imageTitlePopup.css({
          left: position_left,
          top: position_y,
        });

        $imageTitlePopup.find(".image-title-arrow").css({
          left: cx - position_left,
          top: 0,
        });
      }
    }
  }

  function showToolSet() {
    var currentForm = $("form").not(".invisibility");

    var tecrCUToolsElement = $("#tecrCUTools");
    if (tecrCUToolsElement.length) {
      removeAllTools();
      tecrCUToolsElement.remove();
    }

    var toolSetAttr = currentForm.attr("tool-set");
    if (toolSetAttr) {
      const listToolTip = toolSetAttr
        .split(",")
        .map((item) => item.trim())
        .filter(Boolean);

      iseToolSet.initComponents(listToolTip);
    }
  }

  $(document).ready(function () {
    showToolSet();

    removeAudioForMath();
    initDataForISEContent();

    showImageName4Math();

<script type="text/javascript">
  function LessonDrivenReceiveMessage() {
    function getParameterByName(b) {
      var a = RegExp("[?&]" + b + "=([^&]*)").exec(window.location.search);
      return a && decodeURIComponent(a[1].replace(/\+/g, " "));
    }

    this.listenMessage = () => {
      sourceURL = getParameterByName("sourceURL");
      console.log("listen message" + sourceURL);

      $.receiveMessage(function (d) {
        console.log("receiveMessage", d, " from ", sourceURL);

        if (/^showCorrectAnswer=/.test(d.data)) {
          toggleAnswerKey(true);
        } else if (/^printOut/.test(d.data) || /^printPage/.test(d.data)) {
          try {
            printpage();
          } catch (e) {}
        } else if (/^hideCorrectAnswer=/.test(d.data)) {
          toggleAnswerKey(false);
        } else if (/^scaleElement=/.test(d.data)) {
          var c = d.data.split("=")[1];
          scaleElement(c);
          stretchOutDocument();

          if (c < 1) {
            $(".jump-to-passage").css("bottom", 500);
          } else if (c > 1) {
            $(".jump-to-passage").css("bottom", 50);
          } else {
            $(".jump-to-passage").css("bottom", 150);
          }
        }
      }, sourceURL);
    };
  }

  function LessonDrivenSendMessage() {
    var parent_url =
      document.referrer + "/#" + encodeURIComponent(window.location.href);

    this.scrollTop = (position, duration) => {
      _postMessage({ scrollTop: position + "," + duration });
    };

    this.addAccessToken = () => {
      var queryString = window.location.search;
      const urlParams = new URLSearchParams(queryString);

      var accessToken = urlParams.get("access_token");

      $.ajaxSetup({
        beforeSend: function (xhr, opts) {
          if (accessToken) {
            xhr.setRequestHeader("Authorization", "Bearer " + accessToken);
          }

          var setupDomain = window.parent.domainApi;

          if (
            setupDomain &&
            setupDomain != "" &&
            !opts.url.startsWith("http") &&
            !opts.url.includes(setupDomain)
          ) {
            if (opts.url.startsWith("/")) {
              opts.url = setupDomain + opts.url;
            } else {
              opts.url = setupDomain + "/" + opts.url;
            }
          }
        },
      });
    };

    this.triggerNextScreen = () => {
      _postMessage("triggerNextScreen");
    };

    this.goToNextLesson = () => {
      _postMessage("goToNextLesson");
    };

    this.showAssessmentToolbar = (height) => {
      _postMessage("showAssessmentToolbar");
    };

    this.toggleCorrectAnswer = (isShow) => {
      _postMessage("toggleCorrectAnswerMode", isShow);
    };

    this.viewNextQuestion = () => {
      _postMessage("viewNextQuestion");
    };

    this.viewPreviousQuestion = () => {
      _postMessage("viewPreviousQuestion");
    };

    this.handleGoToQuestion = (index) => {
      _postMessage("goToQuestion", index);
    };

    function _postMessage(messageType, params) {
      console.log(
        "send an message.......",
        { messageType: messageType, params: params },
        parent_url,
      );

      if (params == null) {
        $.postMessage(messageType, parent_url, window.parent);
        console.log("iframe postMessage", messageType, " to ", parent_url);
      } else {
        var request = { [messageType]: params };
        $.postMessage(request, parent_url, window.parent);
        console.log("iframe postMessage", request, " to ", parent_url);
      }
    }
  }

  function goNext() {
    crossMessage.viewNextQuestion();
  }
  function goPre() {
    crossMessage.viewPreviousQuestion();
  }

  function onEnterPaginationAC(event, index, maxPage, current) {
    if (event.key === "Enter") {
      goToQuestionAC(index, maxPage, current);
    }
  }

  function goToQuestionAC(index, maxPage, current) {
    let page = parseInt(index, 10);

    if (isNaN(page)) {
      page = current;
    }
    if (page <= 1) {
      page = 1;
    }

    if (page > maxPage) {
      page = maxPage;
    }
    document.getElementById("slPager").value = page;
    crossMessage.handleGoToQuestion(page);
  }

  var crossMessage = new LessonDrivenSendMessage();
  var crossMessageListener = new LessonDrivenReceiveMessage();

  $(document).ready(function () {
    crossMessage.addAccessToken();
    crossMessage.showAssessmentToolbar();
    crossMessageListener.listenMessage();
  });
</script>
